[project]
name = "services"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vikrant Chavan", email = "vikrantschavan3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dataset-analyzer",
    "litellm>=1.100.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.uv.sources]
dataset-analyzer = { path = "../dataset-analyzer", editable = true }

[project.scripts]
services = "services:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
