[project]
name = "dataset-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vikrant Chavan", email = "vikrantschavan3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pandera>=0.33.1",
    "pydantic>=2.13.5",
    "pymongo>=4.18.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
dataset-analyzer = "dataset_analyzer:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
