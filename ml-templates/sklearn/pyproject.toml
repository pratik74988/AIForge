[project]
name = "sklearn-templates"
version = "0.1.0"
description = "Reusable scikit-learn machine learning templates for AI-forge"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "mlflow",
    "pyyaml",
    "joblib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sklearn_templates"]