[project]
name = "aiforge-template-registry"
version = "0.1.0"
description = "Template registry for AIForge ML template packages"
requires-python = ">=3.12,<3.13"

dependencies = []

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiforge_template_registry"]